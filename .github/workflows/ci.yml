name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: soma-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  # The JavaScript implementation is a peer of the Rust one, not a satellite.
  # It runs on Windows because its keystore binds DPAPI and its permission
  # profile binds Windows ACLs; those paths have no meaning on Linux and are
  # exactly the ones worth gating on.
  js:
    name: JS implementation
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare direct-volume secure test root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\soma-ci-temp | Out-Null
          "TEMP=C:\soma-ci-temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=C:\soma-ci-temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Origin binding, release, and security behavior
        shell: cmd
        run: |
          set "PSModulePath="
          npm run check
