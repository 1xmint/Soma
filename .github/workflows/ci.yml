name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Merges performed by the auto-merge workflow use GITHUB_TOKEN, and pushes
  # made with that token do not trigger workflows. main therefore never gets a
  # run of its own: its health is inferred entirely from checks that passed
  # before the merge, against the merge preview rather than the merged result.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soma-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --all-targets

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

  # The JavaScript implementation is a peer of the Rust one, not a satellite.
  # It runs on Windows because its keystore binds DPAPI and its permission
  # profile binds Windows ACLs; those paths have no meaning on Linux and are
  # exactly the ones worth gating on.
  js:
    name: JS implementation
    runs-on: windows-latest
    # The suite runs ~18.5 minutes of tests on its own: the controller-rotation
    # races spawn a hundred concurrent writers, and the evidence and end-to-end
    # suites drive the CLI as separate processes. 20 minutes left no room for
    # checkout and install.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: js

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Prepare direct-volume secure test root
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\soma-ci-temp | Out-Null
          "TEMP=C:\soma-ci-temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=C:\soma-ci-temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify Origin binding, release, and security behavior
        shell: cmd
        run: |
          set "PSModulePath="
          npm run check
