name: Origin conformance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: origin-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  origin-conformance:
    name: Origin conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: origin

    steps:
      - name: Check out Somavera
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: origin/package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run conformance checks
        run: npm run check

      - name: Verify recovery capsule
        run: npm run verify
